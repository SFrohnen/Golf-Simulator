name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: r10-build
    steps:
      - uses: actions/checkout@v4
      - name: Validate and extract v0.24.1+ source ZIP
        working-directory: .
        run: |
          python3 - <<'PYSOURCE'
          import hashlib, json, re
          from pathlib import Path
          from zipfile import ZipFile
          src = Path("r10-source.zip")
          assert src.is_file(), "Upload the new source ZIP as r10-source.zip in the repository root"
          print("Source ZIP SHA256:", hashlib.sha256(src.read_bytes()).hexdigest(), flush=True)
          with ZipFile(src) as z:
              names = set(z.namelist())
              assert "package.json" in names, "Source ZIP must contain package.json at its root"
              package = json.loads(z.read("package.json"))
              version = package.get("version", "unknown")
              print("Source version:", version, flush=True)
              match = re.match(r"^(\d+)\.(\d+)\.(\d+)", version)
              assert match and tuple(map(int, match.groups())) >= (0, 24, 1), "Wrong source ZIP: upload v0.24.1 or newer as r10-source.zip"
              required = {"app/src/main/assets/real-assets.js", "app/src/main/assets/real-assets-license.txt", "app/src/main/assets/real-scene.js", "tools/fetch-real-assets.py", "tests/real-assets.test.py", "tools/build-three.mjs"}
              missing = required - names
              assert not missing, "Source ZIP missing required files: " + ", ".join(sorted(missing))
              assert "fetch-real-assets.py" in package.get("scripts", {}).get("build:three", ""), "Source ZIP has an outdated build:three script"
              bad = z.testzip()
              assert bad is None, "Corrupt ZIP member: " + str(bad)
              target = Path("r10-build")
              target.mkdir()  # Never mix extracted files with previous source trees.
              z.extractall(target)
          print("PASS: correct source ZIP extracted into clean r10-build directory")
          PYSOURCE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test R10 wire protocol
        run: bash tests/run-tests.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore validated offline asset cache
        uses: actions/cache@v4
        with:
          path: .r10-asset-cache
          key: r10-real-assets-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            r10-real-assets-v1-
      - name: Bundle offline Three.js renderer
        env:
          GH_TOKEN: ${{ github.token }}
          R10_ASSET_CACHE: ${{ github.workspace }}/.r10-asset-cache/core.json
        run: npm install --no-audit --no-fund && npm run build:three
      - name: Verify asset bundle before browser tests and APK build
        run: |
          python3 - <<'PYASSETS'
          from pathlib import Path
          import json
          runtime = Path("app/src/main/assets/three-runtime.js")
          pack = Path("app/src/main/assets/real-assets.js")
          assert runtime.is_file() and runtime.stat().st_size > 100000, "Three.js runtime not built"
          assert pack.is_file() and pack.stat().st_size > 100000, "Real assets were not downloaded by build:three"
          text = pack.read_text()
          prefix = "globalThis.R10RealAssets="
          assert text.startswith(prefix), "Invalid real-assets.js format"
          data = json.loads(text[len(prefix):].strip().removesuffix(";"))
          assert {"fairway", "rough", "sand"} <= data["materials"].keys(), "Missing surface materials"
          expected_missing = ({"pine", "broadleaf", "grass"} - data["models"].keys()) | (set() if data.get("hdr") else {"HDRI"})
          assert set(data.get("missing", [])) == expected_missing, "Inconsistent optional asset manifest"
          assert not data.get("hdr") or data["hdr"].startswith("data:"), "Invalid HDR environment"
          assert all(key in data["sources"] for key in data["models"]), "Missing model provenance"
          assert all(all(m.get(k, "").startswith("data:image/jpeg;base64,") for k in ("color", "normal", "roughness")) for m in data["materials"].values()), "Missing required material maps"
          print("PASS: required surface assets bundled", pack.stat().st_size, "bytes")
          if expected_missing: print("WARNING: optional asset fallback:", sorted(expected_missing))
          PYASSETS
      - name: Test Three.js geometry adapter
        run: node tests/three-scene.test.js
      - name: Test actual Three.js WebGL rendering
        run: |
          npx playwright install --with-deps chromium
          node tests/three-browser-smoke.cjs
      - name: Upload graphics comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R10-Graphics-Comparison
          path: r10-build/visual-previews/*.png
          if-no-files-found: warn
      - name: Test flight engine
        run: node tests/flight.test.js
      - name: Test history import
        run: node tests/history-import.test.js
      - name: Test calibration regression
        run: node tests/reference-replay.test.js
      - name: Test club analytics
        run: node tests/club-analytics.test.js && node tests/caddie.test.js
      - name: Test session and practice
        run: |
          node tests/session-shapes.test.js
          node tests/practice.test.js
          node tests/coach.test.js
          node tests/course.test.js
          node tests/course-rollout.test.js
          node tests/career.test.js
          node tests/terrain.test.js
          node tests/course-map.test.js
          node tests/weiherhof.test.js
          python3 tests/terrain-import.test.py
          python3 tests/course-import.test.py
          python3 tests/course-acquisition.test.py
          node tests/ui-smoke.test.js
          node tests/v015.test.js
          node tests/game-hud.test.js
          node tests/range3d.test.js
          node tests/course3d.test.js
          node tests/tree-flight.test.js
      - run: gradle --no-daemon assembleDebug
      - name: Verify Three.js and real assets are inside the APK
        run: |
          python3 - <<'PYAPK'
          from pathlib import Path
          from zipfile import ZipFile
          runtime = Path("app/src/main/assets/three-runtime.js").read_bytes()
          assert len(runtime) > 100000, "Three.js runtime missing or placeholder"
          pack = Path("app/src/main/assets/real-assets.js").read_bytes()
          assert len(pack) > 100000, "Real asset bundle missing or placeholder"
          with ZipFile("app/build/outputs/apk/debug/app-debug.apk") as apk:
              assert apk.read("assets/three-runtime.js") == runtime, "APK runtime differs from built runtime"
              assert "assets/three-license.txt" in apk.namelist(), "Three.js license missing"
              assert apk.read("assets/real-assets.js") == pack, "APK real asset bundle differs from downloaded pack"
              assert "assets/real-assets-license.txt" in apk.namelist(), "Asset license missing"
          print("PASS: Three.js and real assets in APK", len(runtime), len(pack), "bytes")
          PYAPK
      - uses: actions/upload-artifact@v4
        with:
          name: R10-Private-Range-APK
          path: r10-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
